name: Firebase production deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "firebase.json"
      - "firestore.rules"
      - "firestore.indexes.json"
      - "hosting/public/**"

concurrency:
  group: firebase-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Restore Firebase deploy identity
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"
      - name: Deploy Auth, Firestore, and Hosting
        run: npx --yes firebase-tools@latest deploy --project owefolk-20260801 --only auth,firestore,hosting --non-interactive
