name: Publish to Google Play

on:
  workflow_dispatch:
    inputs:
      track:
        description: "Target track (internal, alpha, beta, production)"
        required: false
        default: "internal"
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      status:
        description: "Release status (draft, inProgress, completed)"
        required: false
        default: "draft"
        type: choice
        options:
          - draft
          - inProgress
          - completed
      release_notes:
        description: "en-US release notes text"
        required: false
        default: "New: on-device translation. Pick a language and Owefolk translates group names, expenses, balances, and the activity feed right on your device with ML Kit, so your text never leaves your phone. Available from onboarding or Settings > Display language."
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Restore protected build inputs
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/owefolk-release.jks"
      - name: Build signed App Bundle
        env:
          OWEFOLK_KEYSTORE_PATH: ${{ runner.temp }}/owefolk-release.jks
          OWEFOLK_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          OWEFOLK_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          OWEFOLK_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_BANNER_ID: ${{ secrets.ADMOB_BANNER_ID }}
          ADMOB_INTERSTITIAL_ID: ${{ secrets.ADMOB_INTERSTITIAL_ID }}
          GH_REPO_OWNER: ${{ secrets.GH_REPO_OWNER }}
          GH_REPO_NAME: ${{ secrets.GH_REPO_NAME }}
          FEEDBACK_PROXY_URL: https://owefolk-api.charles-h-hartmann1.workers.dev
        run: ./gradlew bundleRelease
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Play API client
        run: pip install --quiet google-api-python-client google-auth
      - name: Publish to Google Play
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          python play/publish.py \
            --aab app/build/outputs/bundle/release/app-release.aab \
            --track "${{ github.event.inputs.track }}" \
            --status "${{ github.event.inputs.status }}" \
            --notes "${{ github.event.inputs.release_notes }}" \
            --commit