name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - if: matrix.language == 'java-kotlin'
        uses: android-actions/setup-android@v3
      - if: matrix.language == 'java-kotlin'
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - if: matrix.language == 'java-kotlin'
        name: Restore Firebase Android configuration
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
      - if: matrix.language == 'java-kotlin'
        name: Build for analysis
        env:
          GH_REPO_OWNER: ${{ secrets.GH_REPO_OWNER }}
          GH_REPO_NAME: ${{ secrets.GH_REPO_NAME }}
          FEEDBACK_PROXY_URL: https://owefolk-api.charles-h-hartmann1.workers.dev
        run: ./gradlew compileDebugKotlin compileDebugJavaWithJavac
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
